org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX always-on. `nonTransitiveRClass` keeps each module's R class
# scoped to its own resources, dramatically faster incremental builds for
# large modular projects (xboard-client is small but no harm).
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# This repository commonly lives in a Chinese-named Windows workspace.
# Bypass AGP's conservative check. Some Windows Kotlin versions still need
# an ASCII build checkout; see android/README.md for the verified workflow.
android.overridePathCheck=true


kotlin.code.style=official
