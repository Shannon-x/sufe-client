name: Release Mobile

# Tag-driven Android APK build. Companion to release.yml (desktop four
# targets); a single `git push --tags` fans out to both workflows so the
# v1.x.0 GitHub Release ends up with .dmg / .msi / .deb / .AppImage / .apk
# assets all in one place.
#
# iOS is intentionally absent — distribution requires a $99/yr Apple
# Developer Program account. Re-add the iOS job when ready by reverting
# this commit and supplying APPLE_* secrets.
#
# Required secrets (Android signing — generate locally with
# `bash ci/scripts/generate-release-keys.sh android`):
#   ANDROID_KEYSTORE_BASE64    base64-encoded keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          signing key alias
#   ANDROID_KEY_PASSWORD       signing key password
#
# A release without a keystore is rejected. Android in-app updating is not
# implemented; the generated manifest is distribution metadata only.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'
  MIHOMO_VERSION: ${{ vars.MIHOMO_VERSION || 'v1.19.30' }}
  SUFE_DEPLOYMENT_JSON: ${{ secrets.SUFE_DEPLOYMENT_JSON }}

jobs:
  android:
    if: github.event_name != 'release'
    name: Android APK
    runs-on: ubuntu-22.04
    env:
      # Expose secret presence as a boolean string ('true' / 'false') so
      # step-level `if:` can branch without referencing `secrets` directly
      # (the GitHub Actions schema validator rejects `secrets.X` inside
      # step `if`, even though it works at runtime).
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Android signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo '::error::All four Android signing secrets are required for a release'; exit 1;
          }

      - name: Install Linux build dependencies
        # The `:app:generateUniffiBindings` Gradle task runs `cargo run -p
        # xboard-core --bin uniffi-bindgen` on the host, which compiles
        # xboard-core for x86_64-unknown-linux-gnu and pulls in keyring →
        # libdbus-sys. The build script needs libdbus-1 dev headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: release-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager "ndk;27.3.13750724" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.3.13750724" >> "${GITHUB_ENV}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Bootstrap gradle wrapper
        run: bash android/bootstrap-wrapper.sh

      - name: Cross-compile xboard-core (.so per ABI)
        run: |
          cd core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            --platform 24 -o ../android/app/src/main/jniLibs build --release --locked --lib -p xboard-core

      - name: Fetch mihomo Android binaries
        run: bash ci/scripts/install-mihomo-android.sh "${MIHOMO_VERSION}"

      - name: assembleRelease
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        id: sign
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="${RUNNER_TEMP}/sufe-release.jks"
          trap 'rm -f "${keyfile}"' EXIT
          printf '%s' "${KEYSTORE}" | base64 --decode > "${keyfile}"
          tools="${ANDROID_HOME}/build-tools/34.0.0"
          unsigned=android/app/build/outputs/apk/release/app-release-unsigned.apk
          aligned="${RUNNER_TEMP}/sufe-aligned.apk"
          signed=android/app/build/outputs/apk/release/app-release-signed.apk
          "${tools}/zipalign" -f -p 4 "${unsigned}" "${aligned}"
          "${tools}/apksigner" sign --ks "${keyfile}" --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "${signed}" "${aligned}"
          "${tools}/apksigner" verify "${signed}"
          echo "signedReleaseFile=${signed}" >> "${GITHUB_OUTPUT}"

      - name: Verify native ABI completeness and 16 KB compatibility
        run: python3 android/verify-native.py "${{ steps.sign.outputs.signedReleaseFile }}"

      - name: Compute APK sha256
        id: hash
        run: |
          set -euo pipefail
          apk="${{ steps.sign.outputs.signedReleaseFile }}"
          if [ -z "${apk}" ]; then
            echo "::error::no APK produced under android/app/build/outputs/apk/release"
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          dest="xboard-${tag}-android.apk"
          cp "${apk}" "${dest}"
          sha=$(shasum -a 256 "${dest}" | awk '{print $1}')
          echo "apk_path=${dest}" >> "${GITHUB_OUTPUT}"
          echo "apk_sha256=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.hash.outputs.apk_path }}
          draft: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write mobile manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p _manifest/mobile/android
          cat > _manifest/mobile/android/latest.json <<EOF
          {
            "version": "${tag}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.hash.outputs.apk_path }}",
            "sha256": "${{ steps.hash.outputs.apk_sha256 }}",
            "min_version": "0.1.0",
            "force": false,
            "notes": "Tag ${GITHUB_REF_NAME}"
          }
          EOF

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-manifest-android
          path: _manifest/mobile/android/latest.json

      - name: Attach mobile manifest to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp _manifest/mobile/android/latest.json android-latest.json
          gh release upload "${GITHUB_REF_NAME}" android-latest.json --clobber

  # ---------------- Publish gh-pages manifest ----------------
  publish-mobile-manifest:
    name: Publish mobile manifest
    needs: [android]
    runs-on: ubuntu-22.04
    if: always() && github.event_name == 'release'
    concurrency:
      group: publish-update-manifests
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
        continue-on-error: true

      - name: Initialize gh-pages if missing
        run: |
          if [ ! -d .git ]; then
            git init -b gh-pages
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Download published mobile manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mobile/android
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern android-latest.json --dir mobile/android --clobber
          mv mobile/android/android-latest.json mobile/android/latest.json

      - name: Commit & push gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add mobile/android/latest.json
          git diff --staged --quiet || git commit \
            -m "publish mobile manifest for ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
